<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafe Portfolio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      /* ENVIROMENT: Céu de Turim / Estilo Roman Klčo */
      background-image: 
        radial-gradient(circle at 15% 85%, rgba(255, 133, 116, 0.7) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(132, 60, 246, 0.5) 0%, transparent 50%),
        linear-gradient(to top, #abdbe3 0%, #e0f2fe 100%) !important;
      background-attachment: fixed;
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas { 
      display: block; 
      cursor: pointer; 
      background-color: transparent !important;
    }

    /* CARD DE INFORMAÇÕES (MODAL DIREITO) */
    #info-panel {
      position: absolute;
      top: 50%;
      right: -450px;
      transform: translateY(-50%);
      width: 380px;
      max-width: 85vw;
      background: rgba(35, 35, 35, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      color: #ffffff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    #info-panel.active { 
      right: 40px; 
    }

    /* BOTÃO FECHAR (X) */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    #info-title {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #f39c12;
    }

    #info-description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #ddd;
    }
  </style>
</head>
  
<body>

  <!-- RETÂNGULO CINZA (UI DO MODAL) -->
  <div id="info-panel">
    <button class="close-btn" id="close-btn">&times;</button>
    <h2 id="info-title">Título do Objeto</h2>
    <p id="info-description">Descrição do asset selecionado...</p>
  </div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  // IMPORTS ADICIONADOS PARA O BRILHO (BLOOM)
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

  // 1. CENA (Forçamos o fundo como nulo para garantir transparência do CSS)
  const scene = new THREE.Scene();
  scene.background = null;

  // 2. CAMERA isométrica
  const w = window.innerWidth, h = window.innerHeight;
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 100);
  const initialCameraPos = new THREE.Vector3(-1.3, 0.5, 1.2);
  const initialTargetPos = new THREE.Vector3(0, 0, 0);  
  camera.position.copy(initialCameraPos);
  camera.lookAt(initialTargetPos);

  // 3. RENDERER COM TRANSPARÊNCIA ATIVADA
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000, 0); // Totalmente transparente!
  document.body.appendChild(renderer.domElement);

  // 4. CONFIGURAÇÃO DO POST-PROCESSING (BRILHO DOURADO SUAVE)
  // Reintroduzimos o Bloom configurado para não travar o alpha.
  const renderPass = new RenderPass(scene, camera);
  
  // UnrealBloomPass(Resolução, Intensidade, Raio, Threshold)
  // Threshold alto (0.85) garante que SÓ as partículas que "estourarem" o brilho fiquem com aura.
  // Intensidade moderada (1.0) para ser sutil.
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.0,  // Intensidade da aura de luz
    0.35, // Raio de espalhamento
    0.85  // Limiar
  );

  const composer = new EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(bloomPass);

  // O SEGREDO: Manter o renderPass principal como limpo/transparente
  renderPass.clearAlpha = 0;

  // LUZES HARMONIZADAS COM O ENVIROMENT
  const ambient = new THREE.AmbientLight(0xf472b6, 0.5);
  scene.add(ambient);
  
  const dirLight = new THREE.DirectionalLight(0xffbe76, 1.4);
  dirLight.position.set(-2, 5, 3);
  scene.add(dirLight);
  
  const frontLight = new THREE.DirectionalLight(0x818cf8, 0.8);
  frontLight.position.set(2, -2, -5);
  scene.add(frontLight);

  // CONTROLES
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.rotateSpeed = 0.4;
  controls.enableDamping = true;
  controls.dampingFactor = 0.03;
  controls.minAzimuthAngle = -Math.PI * 0.8;
  controls.maxAzimuthAngle = 0.2; 
  controls.minPolarAngle = Math.PI * 0.2;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.enableZoom = false;

  // VARIÁVEL GLOBAL PARA OS VAGA-LUMES
  let grupoVagalumes = null;
  const clock = new THREE.Clock();

  // CRIAÇÃO DOS VAGA-LUMES (RESTAURADO MATERIAL E EMISSÃO)
  function criarVagalumes() {
    const particleGroup = new THREE.Group();
    const particleGeo = new THREE.IcosahedronGeometry(0.002, 0); // Tamanho sutil
    
    for (let i = 0; i < 35; i++) {
      // Voltamos para o MeshStandardMaterial para suportar EMISSIVE!
      const particleMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffd1a7,        // Tom dourado/quente no centro
        emissiveIntensity: 6.0,    // Intensidade alta para "estourar" e gerar o Bloom
        roughness: 0.1,
        transparent: true,
        opacity: 0.9,
        metalness: 0.0,
      });

      const mesh = new THREE.Mesh(particleGeo, particleMat);
      
      const radius = 0.3 + Math.random() * 0.5;
      const angle = Math.random() * Math.PI * 2;
      
      // Guardamos a Posição Inicial Base para flutuação
      const initialX = Math.cos(angle) * radius;
      const initialY = Math.random() * 0.4 + 0.05;
      const initialZ = Math.sin(angle) * radius;

      mesh.position.set(initialX, initialY, initialZ);

      // PARÂMETROS INDIVIDUAIS DE FLUTUAÇÃO LENTA
      mesh.userData = {
        baseX: initialX, baseY: initialY, baseZ: initialZ,
        speed: 1.0 + Math.random() * 1.5, // Brilho pulsando devagar
        offset: Math.random() * Math.PI * 2,
        baseIntensity: 3.0 + Math.random() * 5.0, // Pico de brilho sutil

        // VELOCIDADES DE VÔO (MUITO MAIS LENTAS)
        // Reduzimos as velocidades anteriores de 0.8+ para 0.1+
        flySpeedX: 0.15 + Math.random() * 0.2, // Reduzido drasticamente
        flySpeedY: 0.2 + Math.random() * 0.2,
        flySpeedZ: 0.1 + Math.random() * 0.15,
        rangeX: 0.03 + Math.random() * 0.04, // Raio de flutuação pequeno
        rangeY: 0.04 + Math.random() * 0.05,
        rangeZ: 0.03 + Math.random() * 0.04
      };

      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      particleGroup.add(mesh);
    }

    return particleGroup;
  }

  // CARREGAR O GLB
  const loader = new GLTFLoader();
  loader.load(
    './assets/cafe_v007.glb',
    (gltf) => {
      // Adicionamos diretamente na cena GLTF para manter hierarquia se necessário
      grupoVagalumes = criarVagalumes();
      gltf.scene.add(grupoVagalumes);

      scene.add(gltf.scene);
      console.log('✅ Café e vaga-lumes lentos/brilhantes carregados!');
    },
    (progress) => {},
    (error) => { console.error('Erro ao carregar o GLB:', error); }
  );

  // CONFIGURAÇÃO DOS ASSETS
  const configObjetos = {
    'mesh_char_low': {
      titulo: 'Personagem
