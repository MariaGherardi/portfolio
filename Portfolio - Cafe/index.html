<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafe Portfolio</title>
  <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #1a0a0a; 
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas { display: block; cursor: pointer; }

    /* CARD DE INFORMAÇÕES (MODAL DIREITO) */
    #info-panel {
      position: absolute;
      top: 50%;
      right: -450px; /* Escondido por padrão fora da tela */
      transform: translateY(-50%);
      width: 380px;
      max-width: 85vw;
      background: rgba(35, 35, 35, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      color: #ffffff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    /* Classe ativada no clique do objeto */
    #info-panel.active { 
      right: 40px; 
    }

    /* BOTÃO FECHAR (X) */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    #info-title {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #f39c12;
    }

    #info-description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #ddd;
    }
  </style>
</head>
  
<body>

  <!-- RETÂNGULO CINZA (UI DO MODAL) -->
  <div id="info-panel">
    <button class="close-btn" id="close-btn">&times;</button>
    <h2 id="info-title">Título do Objeto</h2>
    <p id="info-description">Descrição do asset selecionado...</p>
  </div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // CENA
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0a0a);

  // CAMERA isométrica
  const w = window.innerWidth, h = window.innerHeight;
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 100);
  const initialCameraPos = new THREE.Vector3(-1.3, 0.5, 1.2);
  const initialTargetPos = new THREE.Vector3(0, 0, 0);  
  camera.position.copy(initialCameraPos);
  camera.lookAt(initialTargetPos);

  // RENDERER
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // LUZ
  const ambient = new THREE.AmbientLight(0xffffff, 2);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(2, 5, 3);
  scene.add(dirLight);
  const frontLight = new THREE.DirectionalLight(0xffffff, 2);
  frontLight.position.set(-2, 3, 5);
  scene.add(frontLight);

  // CONTROLES (para explorar a cena)
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.rotateSpeed = 0.4;
  controls.enableDamping = true;
  controls.dampingFactor = 0.03;
  controls.minAzimuthAngle = -Math.PI * 0.8; // Impede ver as costas da casa
  controls.maxAzimuthAngle = 0.2;  // Impede ver as costas da casa
  controls.minPolarAngle = Math.PI * 0.2;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.enableZoom = false;

  

  // CARREGAR O GLB
  const loader = new GLTFLoader();
  loader.load(
    './assets/cafe_v004.glb',
    (gltf) => {
      scene.add(gltf.scene);
      console.log('✅ Café carregado!');

      // Lista todos os objetos no console
      gltf.scene.traverse((obj) => {
        if (obj.isMesh) console.log('Objeto:', obj.name);
      });
    },
    (progress) => {
      console.log('Carregando...', (progress.loaded / progress.total * 100).toFixed(0) + '%');
    },
    (error) => {
      console.error('Erro ao carregar o GLB:', error);
    }
  );

  //  CONFIGURAÇÃO DOS 4 ASSETS, CÂMERA LATERAL E MODAL UI
  const configObjetos = {
    'mesh_char_low': {
      titulo: 'Personagem',
      descricao: 'Modelo do personagem interagindo no cenário.',
      // Câmera posicionada bem de frente para o personagem
      cameraPos: { x: 0.1, y: 0.45, z: 0.85 },
      // Target empurrado para a DIREITA (+X) para o personagem ir para a ESQUERDA
      targetPos: { x: 0.25, y: 0.25, z: 0.1 }
    },
    'mesh_glass_low': {
      titulo: 'Vidros e Cafeteira',
      descricao: 'Detalhes e modelos 3D dos utilitários de vidro do café.',
      cameraPos: { x: -0.3, y: 0.4, z: 0.75 },
      targetPos: { x: 0.25, y: 0.2, z: 0.0 }
    },
    'mesh_artstation_low': {
      titulo: 'ArtStation',
      descricao: 'Confira meus outros modelos no portfólio do ArtStation.',
      cameraPos: { x: -0.2, y: 0.35, z: 0.65 },
      targetPos: { x: 0.2, y: 0.1, z: -0.1 }
    },
    'mesh_linkedin_low': {
      titulo: 'LinkedIn',
      descricao: 'Conecte-se comigo no LinkedIn para oportunidades.',
      cameraPos: { x: -0.3, y: 0.35, z: 0.55 },
      targetPos: { x: 0.25, y: 0.1, z: -0.2 }
    }
  };

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let isZoomedIn = false;

  // Lógica para detectar se foi apenas um arrasto de rotação da cena
  let isDragging = false;
  let pointerDownPos = { x: 0, y: 0 };

  window.addEventListener('pointerdown', (e) => {
    isDragging = false;
    pointerDownPos = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointermove', (e) => {
    if (Math.abs(e.clientX - pointerDownPos.x) > 5 || Math.abs(e.clientY - pointerDownPos.y) > 5) {
      isDragging = true;
    }
  });

  window.addEventListener('pointerup', (event) => {
    // Se arrastou a tela ou clicou no próprio modal, ignora
    if (isDragging || event.target.closest('#info-panel')) return;

    // Se a câmera já estiver travada em zoom num objeto, IGNOIRA cliques na tela 3D
    // (Agora o usuário é OBRIGADO a clicar no 'X' para sair)
    if (isZoomedIn) return; 

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    if (intersects.length > 0) {
      const clickedObject = intersects[0].object;
      const meshName = clickedObject.geometry ? clickedObject.geometry.name : '';
      const objectName = clickedObject.name;

      // Busca qual dos 4 objetos foi clicado
      const chave = Object.keys(configObjetos).find(
        (key) => key === meshName || key === objectName
      );

      if (chave) {
        focarObjeto(configObjetos[chave]);
      }
    }
  });
  
  // Função para focar o objeto e abrir o painel UI
  function focarObjeto(dados) {
    isZoomedIn = true;
    controls.enabled = false; // Desativa rotação manual durante a visualização do objeto

    // Preenche os dados e exibe o modal
    document.getElementById('info-title').innerText = dados.titulo;
    document.getElementById('info-description').innerText = dados.descricao;
    document.getElementById('info-panel').classList.add('active');

    // Anima a câmera para posicionar o objeto na esquerda
    gsap.to(camera.position, {
      x: dados.cameraPos.x,
      y: dados.cameraPos.y,
      z: dados.cameraPos.z,
      duration: 1.2,
      ease: 'power2.out'
    });

    gsap.to(controls.target, {
      x: dados.targetPos.x,
      y: dados.targetPos.y,
      z: dados.targetPos.z,
      duration: 1.2,
      ease: 'power2.out',
      onUpdate: () => controls.update()
    });
  }

  // Função para fechar o modal e resetar para a posição inicial do site
  function resetToInitialPosition() {
    document.getElementById('info-panel').classList.remove('active');

    gsap.to(camera.position, {
      x: initialCameraPos.x,
      y: initialCameraPos.y,
      z: initialCameraPos.z,
      duration: 1.2,
      ease: 'power2.out'
    });

    gsap.to(controls.target, {
      x: initialTargetPos.x,
      y: initialTargetPos.y,
      z: initialTargetPos.z,
      duration: 1.2,
      ease: 'power2.out',
      onUpdate: () => controls.update(),
      onComplete: () => {
        isZoomedIn = false;
        controls.enabled = true; // Reativa os controles manuais
      }
    });
  }

  // Evento do Botão X
  document.getElementById('close-btn').addEventListener('click', resetToInitialPosition);

  // RESIZE
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // LOOP DE ANIMAÇÃO
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

</script>
</body>
</html>
