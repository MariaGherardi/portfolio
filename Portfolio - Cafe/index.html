<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafe Portfolio Turin - Top View</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    body { 
      /* Gradiente do Céu de Turim */
      background: 
        radial-gradient(circle at 15% 85%, rgba(255, 133, 116, 0.7) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(132, 60, 246, 0.5) 0%, transparent 50%),
        linear-gradient(to top, #abdbe3 0%, #e0f2fe 100%) !important;
      background-attachment: fixed;
    }

    canvas { display: block; width: 100vw !important; height: 100vh !important; background: transparent !important; cursor: pointer; }

    /* UI do Modal */
    #info-panel {
      position: absolute; top: 50%; right: -450px; transform: translateY(-50%);
      width: 380px; max-width: 85vw; background: rgba(35, 35, 35, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      padding: 30px; color: #ffffff; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 10;
    }
    #info-panel.active { right: 40px; }
    .close-btn {
      position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.1);
      border: none; color: #fff; font-size: 18px; font-weight: bold; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.1); }
    #info-title { font-size: 1.4rem; margin-bottom: 12px; color: #f39c12; }
    #info-description { font-size: 0.95rem; line-height: 1.6; color: #ddd; }
  </style>
</head>
  
<body>
  <div id="info-panel">
    <button class="close-btn" id="close-btn">&times;</button>
    <h2 id="info-title">Título do Objeto</h2>
    <p id="info-description">Descrição...</p>
  </div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // 1. CENA
  const scene = new THREE.Scene();
  const w = window.innerWidth, h = window.innerHeight;

  // 2. CÂMERA (Posicionada mais no alto, estilo vista isométrica/top-down da referência)
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 100);
  camera.position.set(-0.85, 0.28, 0.85); // Afasta levemente no plano horizontal 
  camera.lookAt(0, 0.2, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);



  // 4. ILUMINAÇÃO
  const ambient = new THREE.AmbientLight(0xffd1dc, 0.8); 
  scene.add(ambient);
  
  const sunLight = new THREE.DirectionalLight(0xffe0b2, 2.5); 
  sunLight.position.set(3, 5, 2);
  scene.add(sunLight);
  
  const coolLight = new THREE.DirectionalLight(0x7dd3fc, 1.2); 
  coolLight.position.set(-3, 3, -2);
  scene.add(coolLight);

  // CONTROLES DE CÂMERA
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; 
  controls.dampingFactor = 0.03; // Quanto menor, mais suave e "pesado" fica o movimento (padrão: 0.05)
  controls.rotateSpeed = 0.25;   // Reduz drasticamente a velocidade de rotação do mouse (padrão: 1.0)
  controls.enableZoom = false; 
  controls.target.set(0, 0.2, 0); 
  
  controls.minPolarAngle = Math.PI / 6; 
  controls.maxPolarAngle = Math.PI / 2.05;

  // 5. VAGA-LUMES
  const clock = new THREE.Clock();
  const grupoVagalumes = new THREE.Group();
  scene.add(grupoVagalumes);
  const particleGeo = new THREE.IcosahedronGeometry(0.001, 0);

  function criarTexturaGlow() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1.0)');  
    gradient.addColorStop(0.2, 'rgba(255, 200, 120, 0.8)'); 
    gradient.addColorStop(0.6, 'rgba(255, 140, 50, 0.15)');  
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');          
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }
  const textureGlow = criarTexturaGlow();

  for (let i = 0; i < 35; i++) {
    const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const mesh = new THREE.Mesh(particleGeo, particleMat);
    const spriteMat = new THREE.SpriteMaterial({ map: textureGlow, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.8 });
    const glowSprite = new THREE.Sprite(spriteMat);
    glowSprite.scale.set(0.035, 0.035, 1.0); 
    mesh.add(glowSprite); 

    const radius = 0.3 + Math.random() * 0.5; const angle = Math.random() * Math.PI * 2;
    const baseX = Math.cos(angle) * radius; const baseY = Math.random() * 0.4 + 0.05; const baseZ = Math.sin(angle) * radius;
    mesh.position.set(baseX, baseY, baseZ);
    mesh.userData = { baseX, baseY, baseZ, glowSprite, speed: 0.5 + Math.random() * 1.0, offset: Math.random() * Math.PI * 2, flySpeedX: 0.1 + Math.random() * 0.1, flySpeedY: 0.12 + Math.random() * 0.12, flySpeedZ: 0.08 + Math.random() * 0.1, rangeX: 0.03 + Math.random() * 0.03, rangeY: 0.04 + Math.random() * 0.04, rangeZ: 0.03 + Math.random() * 0.03 };
    grupoVagalumes.add(mesh);
  }

  // CARREGAMENTO DO MODELO 3D
  const loader = new GLTFLoader();
  loader.load('./assets/cafe.CAMVBIOTEXTURE2.glb', (gltf) => {
    scene.add(gltf.scene);
  });

  // CONFIGURAÇÕES DE INTERAÇÃO
  const configObjetos = {
    'mesh_char_low': { titulo: 'Personagem', descricao: 'Modelo do personagem interagindo no cenário.', cameraPos: { x: -0.6, y: 0.4, z: 0.4 }, targetPos: { x: 0.15, y: 0.2, z: 0 } },
    'mesh_glass_low': { titulo: 'Vidros e Cafeteira', descricao: 'Detalhes e modelos 3D dos utilitários de vidro do café.', cameraPos: { x: -0.3, y: 0.5, z: 0.75 }, targetPos: { x: 0.25, y: 0.2, z: 0.0 } },
    'mesh_artstation_low': { titulo: 'ArtStation', descricao: 'Confira meus outros modelos no portfólio do ArtStation.', cameraPos: { x: -0.2, y: 0.45, z: 0.65 }, targetPos: { x: 0.2, y: 0.1, z: -0.1 } },
    'mesh_linkedin_low': { titulo: 'LinkedIn', descricao: 'Conecte-se comigo no LinkedIn para oportunidades.', cameraPos: { x: -0.3, y: 0.45, z: 0.55 }, targetPos: { x: 0.25, y: 0.1, z: -0.2 } }
  };

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let isDragging = false, pointerDownPos = { x: 0, y: 0 };

  window.addEventListener('pointerdown', (e) => { isDragging = false; pointerDownPos = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('pointermove', (e) => { if (Math.abs(e.clientX - pointerDownPos.x) > 5 || Math.abs(e.clientY - pointerDownPos.y) > 5) isDragging = true; mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1; });
  window.addEventListener('pointerup', (event) => {
    if (isDragging || event.target.closest('#info-panel')) return;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);
    if (intersects.length > 0) {
      const clickedObject = intersects[0].object;
      const chave = Object.keys(configObjetos).find((key) => key === (clickedObject.geometry ? clickedObject.geometry.name : '') || key === clickedObject.name);
      if (chave) focarObjeto(configObjetos[chave]);
    }
  });

  function focarObjeto(dados) {
    controls.enabled = false;
    document.getElementById('info-panel').classList.add('active');
    gsap.to(camera.position, { x: -0.7, y: 0.28, z: 0.7, duration: 1.2, ease: 'power2.out' });
    gsap.to(controls.target, { x: 0, y: 0.2, z: 0, duration: 1.2, ease: 'power2.out', onUpdate: () => controls.update(), onComplete: () => { controls.enabled = true; } });
  }

  function resetToInitialPosition() {
    document.getElementById('info-panel').classList.remove('active');
    gsap.to(camera.position, { x: -0.85, y: 0.45, z: 0.85, duration: 1.2, ease: 'power2.out' });
    gsap.to(controls.target, { x: 0, y: 0.1, z: 0, duration: 1.2, ease: 'power2.out', onUpdate: () => controls.update(), onComplete: () => { controls.enabled = true; } });
  }

  document.getElementById('close-btn').addEventListener('click', resetToInitialPosition);
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

  // LOOP DE ANIMAÇÃO
  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    grupoVagalumes.children.forEach((p) => {
      const u = p.userData;
      const pulse = Math.sin(elapsedTime * u.speed + u.offset) * 0.5 + 0.5;
      u.glowSprite.material.opacity = 0.3 + pulse * 0.5;
      p.position.x = u.baseX + Math.sin(elapsedTime * u.flySpeedX + u.offset) * u.rangeX;
      p.position.y = u.baseY + Math.cos(elapsedTime * u.flySpeedY + u.offset) * u.rangeY;
      p.position.z = u.baseZ + Math.sin(elapsedTime * u.flySpeedZ + u.offset) * u.rangeZ;
    });

    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
