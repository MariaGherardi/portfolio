<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafe Portfolio</title>
  <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a0a0a; overflow: hidden; }
    canvas { display: block; cursor: pointer; }
  </style>
</head>
  
<body>              
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // CENA
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0a0a);

  // CAMERA isométrica
  const w = window.innerWidth, h = window.innerHeight;
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 100);
  const initialCameraPos = new THREE.Vector3(1.2, 1, 1.2);
  const initialTargetPos = new THREE.Vector3(0, 0, 0);  
  camera.position.copy(initialCameraPos);
  camera.lookAt(initialTargetPos);

  // RENDERER
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // LUZ
  const ambient = new THREE.AmbientLight(0xffffff, 2);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(2, 5, 3);
  scene.add(dirLight);
  const frontLight = new THREE.DirectionalLight(0xffffff, 2);
  frontLight.position.set(-2, 3, 5);
  scene.add(frontLight);

  // CONTROLES (para explorar a cena por enquanto)
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.rotateSpeed = 0.4;
  controls.enableDamping = true;
  controls.dampingFactor = 0.03;
  controls.minAzimuthAngle = -Math.PI * 0.7;
  controls.maxAzimuthAngle = Math.PI * 0.7;
  controls.minPolarAngle = Math.PI * 0.2;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.enableZoom = false;

  // CARREGAR O GLB
  const loader = new GLTFLoader();
  loader.load(
    './assets/cafe_v004.glb',
    (gltf) => {
      scene.add(gltf.scene);
      console.log('✅ Café carregado!');

      // Lista todos os objetos no console
      gltf.scene.traverse((obj) => {
        if (obj.isMesh) console.log('Objeto:', obj.name);
      });
    },
    (progress) => {
      console.log('Carregando...', (progress.loaded / progress.total * 100).toFixed(0) + '%');
    },
    (error) => {
      console.error('Erro ao carregar o GLB:', error);
    }
  );
  
  // RAYCASTER SISTEMA CLIQUE E ZOOM
  const meshesClicaveis = [
    'mesh_glass_low',
    'mesh_char_low',
    'mesh_artstation_low',
    'mesh_linkedin_low'
  ];

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // Guardamos o estado: se está em zoom e onde a câmera estava ANTES do zoom
  let isZoomedIn = false;
  const savedCameraPos = new THREE.Vector3();
  const savedTargetPos = new THREE.Vector3();

  // Variáveis para detectar se o clique foi apenas um "arrasto" de câmera
  let isDragging = false;
  let pointerDownPos = { x: 0, y: 0 };

  // 1. Guarda a posição de onde o botão do mouse/dedo começou a clicar
  window.addEventListener('pointerdown', (e) => {
    isDragging = false;
    pointerDownPos = { x: e.clientX, y: e.clientY };
  });

  // 2. Se o mouse moveu mais de 5px, significa que você está APENAS ORBITANDO/ARRASTANDO a câmera
  window.addEventListener('pointermove', (e) => {
    const moveX = Math.abs(e.clientX - pointerDownPos.x);
    const moveY = Math.abs(e.clientY - pointerDownPos.y);
    if (moveX > 5 || moveY > 5) {
      isDragging = true;
    }
  });

  // 3. Executa o clique apenas se NÃO foi um arrasto de câmera
  window.addEventListener('pointerup', (event) => {
    if (isDragging) return; // Se você estava girando a cena, ignora e NÃO dá reset!

    // Calcula coordenadas (-1 a +1)
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    if (intersects.length > 0) {
      const clickedObject = intersects[0].object;
      const meshName = clickedObject.geometry ? clickedObject.geometry.name : '';
      const objectName = clickedObject.name;

      // Verifica se é clicável
      const eClicavel = meshesClicaveis.some((nome) => {
        return meshName === nome || objectName === nome;
      });

      if (eClicavel) {
        // --- CLICOU EM UM OBJETO VALIDO ---
        
        // Se ainda NÃO estamos em zoom, SALVA a posição que o usuário parou
        if (!isZoomedIn) {
          savedCameraPos.copy(camera.position);
          savedTargetPos.copy(controls.target);
          isZoomedIn = true;
        }

        const targetPosition = new THREE.Vector3();
        clickedObject.getWorldPosition(targetPosition);

        // Define a aproximação suave (offset)
        const offset = new THREE.Vector3(0.5, 0.3, 0.5);
        const newCameraPos = targetPosition.clone().add(offset);

        // Animação GSAP da Câmera
        gsap.to(camera.position, {
          x: newCameraPos.x,
          y: newCameraPos.y,
          z: newCameraPos.z,
          duration: 1.2,
          ease: 'power2.out'
        });

        // Foca o OrbitControls no objeto
        gsap.to(controls.target, {
          x: targetPosition.x,
          y: targetPosition.y,
          z: targetPosition.z,
          duration: 1.2,
          ease: 'power2.out',
          onUpdate: () => controls.update()
        });

      } else if (isZoomedIn) {
        // Clicou em algo neutro enquanto estava com zoom -> Volta para onde parou!
        resetToSavedPosition();
      }

    } else if (isZoomedIn) {
      // Clicou no fundo/fora da cena enquanto estava com zoom -> Volta para onde parou!
      resetToSavedPosition();
    }
  });

  // Função para VOLTAR exatamente de onde a pessoa estava explorando
  function resetToSavedPosition() {
    gsap.to(camera.position, {
      x: savedCameraPos.x,
      y: savedCameraPos.y,
      z: savedCameraPos.z,
      duration: 1.2,
      ease: 'power2.out'
    });

    gsap.to(controls.target, {
      x: savedTargetPos.x,
      y: savedTargetPos.y,
      z: savedTargetPos.z,
      duration: 1.2,
      ease: 'power2.out',
      onUpdate: () => controls.update(),
      onComplete: () => {
        isZoomedIn = false; // Desativa o estado de zoom
      }
    });
  }
  
  // RESIZE
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // LOOP
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

</script>
</body>
</html>
