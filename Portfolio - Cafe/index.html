<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Diorama 3D - Estilo Roman Klčo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 
        GRADIENTE DIRECIONAL (ESTILO ROMAN KLČO / CÉU DE TURIM):
        1. Rosa Salmão no canto inferior esquerdo (Luz do Pôr do Sol)
        2. Roxo/Violeta sutil no canto superior direito (Transição Noturna)
        3. Fundo Base: Azul Cerúleo / Céu Suave
      */
      background-image: 
        radial-gradient(circle at 15% 85%, rgba(255, 133, 116, 0.55) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(132, 60, 246, 0.35) 0%, transparent 50%),
        linear-gradient(to top, #abdbe3 0%, #e0f2fe 100%);
      background-attachment: fixed;
    }

    #webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <canvas id="webgl"></canvas>

  <script>
    // -------------------------------------------------------------
    // 1. CENA, CÂMERA E RENDERER COM TRANSPARÊNCIA
    // -------------------------------------------------------------
    const canvas = document.querySelector('#webgl');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    // Posição Isométrica clássica de diorama
    camera.position.set(10, 8, 12);

    const renderer = new THREE.WebGLRenderer({ 
      canvas: canvas, 
      antialias: true, 
      alpha: true // OBRIGATÓRIO: Permite ver o gradiente CSS no fundo!
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0); // 100% Transparente
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // -------------------------------------------------------------
    // 2. SISTEMA DE ILUMINAÇÃO (AMARRAÇÃO COM O BACKGROUND)
    // -------------------------------------------------------------

    // A) Luz Ambiente (Ligeiramente magenta/rosada para harmonizar)
    const ambientLight = new THREE.AmbientLight(0xf472b6, 0.4);
    scene.add(ambientLight);

    // B) Luz Direcional Principal (SOL QUENTE)
    // Vindo da ESQUERDA/BAIXO para bater exatamente onde o gradiente Salmão está no CSS!
    const sunLight = new THREE.DirectionalLight(0xffbe76, 1.8);
    sunLight.position.set(-8, 10, 6); // Origem: Canto inferior/frente esquerdo
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.001;
    scene.add(sunLight);

    // C) Luz de Rebatimento / Preenchimento Frio (SOMBRAS AZULADAS/ROXAS)
    // Vindo da DIREITA/ATRÁS (canto escuro do céu)
    const bounceLight = new THREE.DirectionalLight(0x818cf8, 0.8);
    bounceLight.position.set(8, -2, -6);
    scene.add(bounceLight);

    // -------------------------------------------------------------
    // 3. DIORAMA BASE (BASE DE PEDRA + ESTRUTURA DO CAFÉ EM L)
    // -------------------------------------------------------------
    const dioramaGroup = new THREE.Group();

    // Chão / Fatia de Terra
    const baseGeo = new THREE.CylinderGeometry(4, 4.2, 1, 8);
    const baseMat = new THREE.MeshStandardMaterial({ 
      color: 0x64748b, 
      roughness: 0.8 
    });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.5;
    baseMesh.receiveShadow = true;
    dioramaGroup.add(baseMesh);

    // Piso de Madeira do Café
    const floorGeo = new THREE.BoxGeometry(5, 0.2, 5);
    const floorMat = new THREE.MeshStandardMaterial({ 
      color: 0xb45309, 
      roughness: 0.4 
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.y = 0.1;
    floorMesh.receiveShadow = true;
    floorMesh.castShadow = true;
    dioramaGroup.add(floorMesh);

    // Paredes do Canto (Estrutura em L)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.7 });
    
    // Parede Fundo
    const wallBack = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 0.2), wallMat);
    wallBack.position.set(0, 1.6, -2.4);
    wallBack.castShadow = true;
    wallBack.receiveShadow = true;
    dioramaGroup.add(wallBack);

    // Parede Esquerda
    const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 5), wallMat);
    wallLeft.position.set(-2.4, 1.6, 0);
    wallLeft.castShadow = true;
    wallLeft.receiveShadow = true;
    dioramaGroup.add(wallLeft);

    // -------------------------------------------------------------
    // 4. O VIDRO FUTURISTA + HOLOGRAMA (EXEMPLO)
    // -------------------------------------------------------------
    const glassGroup = new THREE.Group();

    // Vidro Escuro Translúcido
    const glassGeo = new THREE.PlaneGeometry(1.8, 2.5);
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x0f172a,
      transparent: true,
      opacity: 0.4,
      transmission: 0.6,
      roughness: 0.1,
      ior: 1.5,
      side: THREE.DoubleSide
    });
    const glassMesh = new THREE.Mesh(glassGeo, glassMat);
    glassGroup.add(glassMesh);

    // Interface Holográfica Emissiva (Ciano Néon)
    const hologramGeo = new THREE.PlaneGeometry(1.4, 0.8);
    const hologramMat = new THREE.MeshStandardMaterial({
      color: 0x000000,
      emissive: new THREE.Color(0x06b6d4), // Ciano Brilhante
      emissiveIntensity: 2.5,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });
    const hologramMesh = new THREE.Mesh(hologramGeo, hologramMat);
    hologramMesh.position.z = 0.01; // Levemente à frente do vidro
    glassGroup.add(hologramMesh);

    glassGroup.position.set(1.2, 1.4, 1);
    glassGroup.rotation.y = -Math.PI / 6;
    dioramaGroup.add(glassGroup);

    scene.add(dioramaGroup);

    // -------------------------------------------------------------
    // 5. PARTÍCULAS AMBIENTAIS (POEIRA DOURADA NO AR)
    // -------------------------------------------------------------
    const particleCount = 70;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePos[i] = (Math.random() - 0.5) * 12;
      particlePos[i + 1] = Math.random() * 8;
      particlePos[i + 2] = (Math.random() - 0.5) * 12;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0xfef08a, // Amarelo suave/dourado
      size: 0.06,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // -------------------------------------------------------------
    // 6. LOOP DE ANIMAÇÃO (IDLE ROTATION + RENDER)
    // -------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Rotação Lenta e Suave do Diorama (Atmosfera "Viva")
      dioramaGroup.rotation.y = Math.sin(elapsedTime * 0.2) * 0.15;

      // Animação leve das partículas flutuando
      particles.rotation.y = elapsedTime * 0.02;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // -------------------------------------------------------------
    // 7. RESPONSIVIDADE
    // -------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
