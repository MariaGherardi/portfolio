<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafe Portfolio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    /* 1. GARANTIR ALTURA TOTAL DA TELA PARA O GRADIENTE EXIBIR */
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body { 
      /* ESTILO DO GRADIENTE */
      background: 
        radial-gradient(circle at 15% 85%, rgba(255, 133, 116, 0.6) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(132, 60, 246, 0.4) 0%, transparent 50%),
        linear-gradient(to top, #abdbe3 0%, #e0f2fe 100%) !important;
      background-attachment: fixed;
    }

    /* 2. FORÇAR CANVAS TRANSPARENTE SEM SOBREPOR O FUNDO */
    canvas { 
      display: block; 
      width: 100vw !important;
      height: 100vh !important;
      background-color: transparent !important;
      cursor: pointer; 
    }

    /* CARD DE INFORMAÇÕES (MODAL DIREITO) */
    #info-panel {
      position: absolute;
      top: 50%;
      right: -450px;
      transform: translateY(-50%);
      width: 380px;
      max-width: 85vw;
      background: rgba(35, 35, 35, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      color: #ffffff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    #info-panel.active { 
      right: 40px; 
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    #info-title {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #f39c12;
    }

    #info-description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #ddd;
    }
  </style>
</head>
  
<body>

  <div id="info-panel">
    <button class="close-btn" id="close-btn">&times;</button>
    <h2 id="info-title">Título do Objeto</h2>
    <p id="info-description">Descrição do asset selecionado...</p>
  </div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // 1. CENA TRANSPARENTE
  const scene = new THREE.Scene();

  // 2. CÂMERA
  const w = window.innerWidth, h = window.innerHeight;
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 100);
  const initialCameraPos = new THREE.Vector3(-1.3, 0.5, 1.2);
  const initialTargetPos = new THREE.Vector3(0, 0, 0);  
  camera.position.copy(initialCameraPos);
  camera.lookAt(initialTargetPos);

  // 3. RENDERIZADOR CONFIGURADO PARA TRANSPARÊNCIA
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0); // Alfa totalmente limpo
  renderer.toneMapping = THREE.NoToneMapping; // Desativa mapas que afetam a transparência
  document.body.appendChild(renderer.domElement);

  // LUZES
  const ambient = new THREE.AmbientLight(0xf472b6, 0.6);
  scene.add(ambient);
  
  const dirLight = new THREE.DirectionalLight(0xffbe76, 1.4);
  dirLight.position.set(-2, 5, 3);
  scene.add(dirLight);
  
  const frontLight = new THREE.DirectionalLight(0x818cf8, 0.8);
  frontLight.position.set(2, -2, -5);
  scene.add(frontLight);

  // CONTROLES
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.rotateSpeed = 0.4;
  controls.enableDamping = true;
  controls.dampingFactor = 0.03;
  controls.minAzimuthAngle = -Math.PI * 0.8;
  controls.maxAzimuthAngle = 0.2; 
  controls.minPolarAngle = Math.PI * 0.2;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.enableZoom = false;

  // 4. CRIAÇÃO DAS PARTÍCULAS DIRETAMENTE NA CENA (INDEPENDENTE DO GLTF)
  const clock = new THREE.Clock();
  const grupoVagalumes = new THREE.Group();
  scene.add(grupoVagalumes); // Adicionado diretamente à cena principal

  const particleGeo = new THREE.IcosahedronGeometry(0.002, 0);

  for (let i = 0; i < 35; i++) {
    const particleMat = new THREE.MeshBasicMaterial({
      color: 0xffe2b3,
      transparent: true,
      opacity: 0.85
    });

    const mesh = new THREE.Mesh(particleGeo, particleMat);
    
    // Posições base espalhadas
    const radius = 0.2 + Math.random() * 0.6;
    const angle = Math.random() * Math.PI * 2;
    const baseX = Math.cos(angle) * radius;
    const baseY = Math.random() * 0.5 + 0.05;
    const baseZ = Math.sin(angle) * radius;

    mesh.position.set(baseX, baseY, baseZ);

    // Parâmetros de vôo armazenados em cada partícula
    mesh.userData = {
      baseX, baseY, baseZ,
      speedX: 0.5 + Math.random() * 0.8,
      speedY: 0.8 + Math.random() * 1.0,
      speedZ: 0.6 + Math.random() * 0.8,
      rangeX: 0.05 + Math.random() * 0.05,
      rangeY: 0.06 + Math.random() * 0.06,
      rangeZ: 0.05 + Math.random() * 0.05,
      offset: Math.random() * Math.PI * 2
    };

    grupoVagalumes.add(mesh);
  }

  // CARREGAR MODELO 3D
  const loader = new GLTFLoader();
  loader.load(
    './assets/cafe_v007.glb',
    (gltf) => {
      scene.add(gltf.scene);
    },
    undefined,
    (error) => { console.error('Erro no GLB:', error); }
  );

  // CONFIGURAÇÃO DOS ASSETS
  const configObjetos = {
    'mesh_char_low': {
      titulo: 'Personagem',
      descricao: 'Modelo do personagem interagindo no cenário.',
      cameraPos: { x: -0.6, y: 0.35, z: 0.3 }, 
      targetPos: { x: 0.15, y: 0.2, z: 0 }
    },
    'mesh_glass_low': {
      titulo: 'Vidros e Cafeteira',
      descricao: 'Detalhes e modelos 3D dos utilitários de vidro do café.',
      cameraPos: { x: -0.3, y: 0.4, z: 0.75 },
      targetPos: { x: 0.25, y: 0.2, z: 0.0 }
    },
    'mesh_artstation_low': {
      titulo: 'ArtStation',
      descricao: 'Confira meus outros modelos no portfólio do ArtStation.',
      cameraPos: { x: -0.2, y: 0.35, z: 0.65 },
      targetPos: { x: 0.2, y: 0.1, z: -0.1 }
    },
    'mesh_linkedin_low': {
      titulo: 'LinkedIn',
      descricao: 'Conecte-se comigo no LinkedIn para oportunidades.',
      cameraPos: { x: -0.3, y: 0.35, z: 0.55 },
      targetPos: { x: 0.25, y: 0.1, z: -0.2 }
    }
  };

  // RAYCASTING
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let isDragging = false;
  let pointerDownPos = { x: 0, y: 0 };

  window.addEventListener('pointerdown', (e) => {
    isDragging = false;
    pointerDownPos = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointermove', (e) => {
    if (Math.abs(e.clientX - pointerDownPos.x) > 5 || Math.abs(e.clientY - pointerDownPos.y) > 5) {
      isDragging = true;
    }

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    if (intersects.length > 0) {
      const hoveredObject = intersects[0].object;
      const meshName = hoveredObject.geometry ? hoveredObject.geometry.name : '';
      const objectName = hoveredObject.name;

      const chave = Object.keys(configObjetos).find(
        (key) => key === meshName || key === objectName
      );

      renderer.domElement.style.cursor = chave ? 'pointer' : 'default';
    } else {
      renderer.domElement.style.cursor = 'default';
    }
  });

  window.addEventListener('pointerup', (event) => {
    if (isDragging || event.target.closest('#info-panel')) return;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    if (intersects.length > 0) {
      const clickedObject = intersects[0].object;
      const meshName = clickedObject.geometry ? clickedObject.geometry.name : '';
      const objectName = clickedObject.name;

      const chave = Object.keys(configObjetos).find(
        (key) => key === meshName || key === objectName
      );

      if (chave) focarObjeto(configObjetos[chave]);
    }
  });

  function focarObjeto(dados) {
    controls.enabled = false;
    document.getElementById('info-title').innerText = dados.titulo;
    document.getElementById('info-description').innerText = dados.descricao;
    document.getElementById('info-panel').classList.add('active');

    gsap.to(camera.position, {
      x: dados.cameraPos.x, y: dados.cameraPos.y, z: dados.cameraPos.z,
      duration: 1.2, ease: 'power2.out'
    });

    gsap.to(controls.target, {
      x: dados.targetPos.x, y: dados.targetPos.y, z: dados.targetPos.z,
      duration: 1.2, ease: 'power2.out',
      onUpdate: () => controls.update()
    });
  }

  function resetToInitialPosition() {
    document.getElementById('info-panel').classList.remove('active');

    gsap.to(camera.position, {
      x: initialCameraPos.x, y: initialCameraPos.y, z: initialCameraPos.z,
      duration: 1.2, ease: 'power2.out'
    });

    gsap.to(controls.target, {
      x: initialTargetPos.x, y: initialTargetPos.y, z: initialTargetPos.z,
      duration: 1.2, ease: 'power2.out',
      onUpdate: () => controls.update(),
      onComplete: () => { controls.enabled = true; }
    });
  }

  document.getElementById('close-btn').addEventListener('click', resetToInitialPosition);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 5. LOOP DE ANIMAÇÃO (MOVIMENTANDO CADA PARTÍCULA EM TEMPO REAL)
  function animate() {
    requestAnimationFrame(animate);
    
    const elapsedTime = clock.getElapsedTime();

    // Atualiza a posição de cada partícula individualmente
    grupoVagalumes.children.forEach((p) => {
      const u = p.userData;

      // Movimento suave usando funções seno e cosseno
      p.position.x = u.baseX + Math.sin(elapsedTime * u.speedX + u.offset) * u.rangeX;
      p.position.y = u.baseY + Math.cos(elapsedTime * u.speedY + u.offset) * u.rangeY;
      p.position.z = u.baseZ + Math.sin(elapsedTime * u.speedZ + u.offset) * u.rangeZ;

      // Leve pulso de opacidade
      p.material.opacity = 0.4 + (Math.sin(elapsedTime * 2 + u.offset) * 0.5 + 0.5) * 0.5;
    });

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
